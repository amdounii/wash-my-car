# =====================================================================
#  Wash My Car - configuration
#  Aucune valeur secrète ici : tout passe par des variables d'environnement
#  (voir backend/.env.example et le README).
# =====================================================================
spring.application.name=washmycar-api
server.port=${SERVER_PORT:8081}

# --- MySQL (schéma créé par database/schema.sql) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/washmycar?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma est géré par le script SQL : Hibernate vérifie seulement la correspondance.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false

# --- JWT (32 caractères minimum) ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- URL publique de l'API (utilisée dans le lien de validation envoyé par email) ---
# Sur un téléphone réel, utiliser l'IP du PC : http://192.168.x.x:8081
app.public-base-url=${APP_PUBLIC_URL:http://localhost:8081}

# --- CORS : origines du front React (séparées par des virgules) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Email (SMTP). Si MAIL_HOST est vide, les emails sont écrits dans les logs. ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@washmycar.tn}

# --- Administrateur créé au démarrage (optionnel) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Swagger UI : http://localhost:8081/swagger-ui.html ---
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
