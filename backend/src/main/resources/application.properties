server.port=8081

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/washmycar?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT (RG10) : secret >= 32 caractères, à changer en production ---
app.jwt.secret=ChangeMe-WashMyCar-Secret-Key-Minimum-32-Chars!
app.jwt.expiration-ms=86400000

# --- Confirmation e-mail (RG08, RG09) ---
# false = les clients sont ACTIF directement ; true = confirmation obligatoire
app.email.enabled=false
app.email.base-url=http://localhost:8080
app.email.from=no-reply@washmycar.tn
app.verification.expiration-hours=24
